# Builds the React Native Storybook for Android and iOS in parallel, then
# uploads both to Chromatic in a single build.
# Docs: https://www.chromatic.com/docs/react-native#configure-ci
name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build Android Storybook
        run: npx chromatic react-native-build --platform android --output-dir build-android
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-android
          path: build-android/storybook.apk
          if-no-files-found: error

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build iOS Storybook
        run: npx chromatic react-native-build --platform ios --output-dir build-ios
      # .app is a directory; tar it so file permissions survive the artifact round trip
      - run: tar -C build-ios -cf storybook-ios.tar storybook.app
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-ios
          path: storybook-ios.tar
          if-no-files-found: error

  chromatic:
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: storybook-android
          path: storybook-static
      - uses: actions/download-artifact@v4
        with:
          name: storybook-ios
          path: .
      - run: tar -C storybook-static -xf storybook-ios.tar
      # Filters the manifest to chromatic.include.json
      - run: npm run storybook-generate && npm run generate-manifest
      - name: Publish to Chromatic
        run: npx chromatic -d storybook-static --exit-zero-on-changes --exit-zero-on-errors
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
